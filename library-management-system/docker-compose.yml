version: '3'
services:
  backend:
    build: ./backend
    ports:
      - '8000:8000'
    depends_on:
      - database
    environment:
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=library_management
  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    depends_on:
      - backend
  database:
    image: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=library_management